services:
  task-warlock:
    image: ghcr.io/jonestristand/task-warlock:latest
    # To build locally instead of pulling the published image:
    # build: .
    container_name: task-warlock
    ports:
      - "3000:3000"
    volumes:
      # Persist TaskWarrior data (recommended)
      - ./taskwarlock-data:/home/nextjs/.task

      # Optional: Persist app settings (theme, preferences, filters)
      # - ./taskwarlock-settings:/home/nextjs/.taskwarlock

      # Optional: Mount custom .taskrc configuration
      # - ./taskrc:/home/nextjs/.taskrc:ro

      # Optional: Mount custom TaskWarrior hooks
      # - ./task-hooks:/home/nextjs/.task/hooks
    environment:
      # Optional: Set Node environment
      - NODE_ENV=production
      # Optional: Set container timezone
      # - TZ=America/New_York

      # Optional: Cron schedule for periodic `task sync` (default: every minute).
      # Set to "off" if you don't use a TaskWarrior sync server.
      # - TASK_SYNC_SCHEDULE=*/5 * * * *

      # Optional: Enable the MCP endpoint (/api/mcp) for AI agents.
      # Clients send "Authorization: Bearer <token>". Generate one with: openssl rand -hex 32
      # - MCP_TOKEN=change-me
      
      # Optional: Disable Next.js telemetry
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    
